<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <style>
      :root { --bg: #0f1115; --card: #181b22; --line: #2a2f3a; --text: #e8eaf0; --muted: #9097a6; --accent: #7c9cff; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
      main { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { margin: 0 0 4px; font-size: 28px; }
      .prompt { color: var(--muted); margin: 0 0 24px; }
      form { display: grid; grid-template-columns: 1fr 96px auto; gap: 8px; margin-bottom: 16px; }
      input, button { font: inherit; border-radius: 10px; border: 1px solid var(--line); padding: 10px 12px; }
      input { background: var(--card); color: var(--text); min-width: 0; }
      button { background: var(--accent); color: #0b0d12; border: 0; font-weight: 600; cursor: pointer; }
      ul.entries { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
      ul.entries li { display: flex; justify-content: space-between; gap: 12px; align-items: center;
        background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
      .meta { color: var(--muted); font-size: 13px; }
      .remove { background: transparent; color: var(--muted); padding: 4px 8px; }
      .total { margin: 16px 0; color: var(--muted); }
      .empty { color: var(--muted); text-align: center; padding: 32px 0; }
      .changes { margin-top: 32px; color: var(--muted); font-size: 14px; }
      @media (max-width: 420px) { form { grid-template-columns: 1fr 80px; } form button { grid-column: span 2; } }
    </style>
  </head>
  <body>
    <main>
      <h1>{{TITLE}}</h1>
      <p class="prompt">Built from: “{{PROMPT}}”</p>
      <form id="add">
        <input id="label" placeholder="What did you do?" required />
        <input id="amount" type="number" step="any" placeholder="Amount" />
        <button>Add</button>
      </form>
      <p class="total" id="total"></p>
      <ul class="entries" id="entries"></ul>
      <section class="changes">
        <strong>Changes you asked for</strong>
        <ul>{{CHANGES}}</ul>
      </section>
    </main>
    <script>
      const KEY = "{{STORAGE_KEY}}";
      const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
      const save = (items) => localStorage.setItem(KEY, JSON.stringify(items));
      let items = load();

      function render() {
        const list = document.getElementById("entries");
        list.innerHTML = "";
        if (!items.length) {
          list.innerHTML = '<li class="empty">Nothing here yet. Add your first entry above.</li>';
        }
        for (const item of items) {
          const li = document.createElement("li");
          const left = document.createElement("div");
          left.innerHTML = "<div></div><div class='meta'></div>";
          left.children[0].textContent = item.label;
          left.children[1].textContent = new Date(item.at).toLocaleString() + (item.amount ? " · " + item.amount : "");
          const remove = document.createElement("button");
          remove.className = "remove";
          remove.textContent = "Remove";
          remove.onclick = () => { items = items.filter((i) => i.at !== item.at); save(items); render(); };
          li.append(left, remove);
          list.append(li);
        }
        const sum = items.reduce((total, i) => total + (Number(i.amount) || 0), 0);
        document.getElementById("total").textContent = items.length ? `${items.length} entries · total ${sum}` : "";
        document.querySelector(".changes").hidden = !document.querySelector(".changes li");
      }

      document.getElementById("add").addEventListener("submit", (event) => {
        event.preventDefault();
        const label = document.getElementById("label");
        const amount = document.getElementById("amount");
        items = [{ label: label.value.trim(), amount: amount.value, at: Date.now() }, ...items];
        save(items);
        label.value = ""; amount.value = "";
        render();
      });
      render();
    </script>
  </body>
</html>
